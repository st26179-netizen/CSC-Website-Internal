<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Larder</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
 
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">Lar<span>der</span></a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="cuisine.html">Cuisine</a></li>
        <li><a href="recipes.html">Recipes</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
<section style="padding-top:72px;">
  <div class="wrap contact-layout">
    <div>
      <h1>Get in touch</h1>
      <p class="lede">Recipe not working out, or got a dish you think belongs on Larder? Send it over.</p>
      <div class="contact-detail">
        <div>
          <strong>Email</strong>
          hello@larder.food
        </div>
      </div>
      <div class="contact-detail">
        <div>
          <strong>Follow along</strong>
          @larder.kitchen
        </div>
      </div>
    </div>
 
    <form>
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com">
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" placeholder="What's on your mind?"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="align-self:flex-start;">Send message</button>
    </form>
  </div>
</section>
